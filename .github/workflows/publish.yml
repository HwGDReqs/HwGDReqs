name: Pypi + build + release lol

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version tag (empty for PyPI only)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  # ------------------------Publish to PyPI------------------------
  publish-to-pypi:
    runs-on: ubuntu-latest
    continue-on-error: true
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: python -m build
    
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      run: twine upload dist/*

  # ------------------------Windows Build Online------------------------
  windows-build-online:
    runs-on: windows-latest
    continue-on-error: true
    if: github.event.inputs.release_tag != ''
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Compile Inno Setup installer
      uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
      with:
        path: inno_online.iss
        options: /O+ /O"output"
    
    - name: Find the installer
      id: finder
      shell: pwsh
      run: |
        $exePath = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter "HwGDReqs-setup-online.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($exePath) {
          Write-Host "Found installer at: $($exePath.FullName)"
          $directory = Split-Path -Path $exePath.FullName -Parent
          $filename = Split-Path -Path $exePath.FullName -Leaf
          echo "installer_path=$($exePath.FullName)" >> $env:GITHUB_OUTPUT
          echo "installer_dir=$directory" >> $env:GITHUB_OUTPUT
          echo "installer_file=$filename" >> $env:GITHUB_OUTPUT
        } else {
          Write-Host "::error::HwGDReqs-setup-online.exe not found!"
          exit 1
        }
    
    - name: upload asset to release
      shell: pwsh
      run: |
        Write-Host "Uploading to release: ${{ github.event.inputs.release_tag }}"
        Write-Host "Installer path: ${{ steps.finder.outputs.installer_path }}"
        
        gh release upload "${{ github.event.inputs.release_tag }}" `
          "${{ steps.finder.outputs.installer_path }}" `
          --clobber
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: hwgdreqs-windows-builds-online
        path: |
          ${{ steps.finder.outputs.installer_path }}

  # ------------------------Windows Build------------------------
  windows-build:
    runs-on: windows-latest
    continue-on-error: true
    if: github.event.inputs.release_tag != ''
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Inject Kick Client Secret
      shell: pwsh
      run: |
        if ($env:KICK_CLIENT_SECRET) {
          Add-Content -Path "hwgdreqs/config.py" -Value "`nKICK_CLIENT_SECRET = KICK_CLIENT_SECRET or '$env:KICK_CLIENT_SECRET'"
        }
      env:
        KICK_CLIENT_SECRET: ${{ secrets.KICK_CLIENT_SECRET }}
    
    - name: pyinst.bat
      shell: cmd
      run: |
        python -m pip install pyinstaller
        python -m pip install -r requirements.txt
        python -m PyInstaller HwGDReqs.spec

    - name: Check warnings
      shell: pwsh
      run: |
        if (Test-Path "build/HwGDReqs/warn-HwGDReqs.txt") {
          Get-Content "build/HwGDReqs/warn-HwGDReqs.txt"
        }
    
    - name: dist/hwgdreqs zip
      shell: pwsh
      run: |
        Compress-Archive -Path dist/hwgdreqs/* -DestinationPath hwgdreqs-windows-portable.zip -Force
    
    - name: Compile Inno Setup installer
      uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
      with:
        path: inno.iss
        options: /O+ /O"output"
    
    - name: Find the installer
      id: finder
      shell: pwsh
      run: |
        $exePath = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter "HwGDReqs-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($exePath) {
          Write-Host "Found installer at: $($exePath.FullName)"
          $directory = Split-Path -Path $exePath.FullName -Parent
          $filename = Split-Path -Path $exePath.FullName -Leaf
          echo "installer_path=$($exePath.FullName)" >> $env:GITHUB_OUTPUT
          echo "installer_dir=$directory" >> $env:GITHUB_OUTPUT
          echo "installer_file=$filename" >> $env:GITHUB_OUTPUT
        } else {
          Write-Host "::error::HwGDReqs-setup.exe not found!"
          exit 1
        }
    
    - name: upload asset to release
      shell: pwsh
      run: |
        Write-Host "Uploading to release: ${{ github.event.inputs.release_tag }}"
        Write-Host "Installer path: ${{ steps.finder.outputs.installer_path }}"
        
        gh release upload "${{ github.event.inputs.release_tag }}" `
          hwgdreqs-windows-portable.zip `
          "${{ steps.finder.outputs.installer_path }}" `
          --clobber
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: hwgdreqs-windows-builds
        path: |
          hwgdreqs-windows-portable.zip
          ${{ steps.finder.outputs.installer_path }}

  # ------------------------macOS Intel Build------------------------
  macos-intel-build:
    runs-on: macos-15-intel
    continue-on-error: true
    if: github.event.inputs.release_tag != ''
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Inject Kick Client Secret
        run: |
          if [ -n "$KICK_CLIENT_SECRET" ]; then
            echo "" >> hwgdreqs/config.py
            echo "KICK_CLIENT_SECRET = KICK_CLIENT_SECRET or '$KICK_CLIENT_SECRET'" >> hwgdreqs/config.py
          fi
        env:
          KICK_CLIENT_SECRET: ${{ secrets.KICK_CLIENT_SECRET }}

      - name: Build macOS app
        run: |
          pyinstaller --windowed --name HwGDReqs --icon assets/icon.icns --add-data "assets:assets" --osx-bundle-identifier=com.malikhw.hwgdreqs --target-architecture x86_64 hwgdreqs/main.py

      - name: Update version in Info.plist
        run: |
          VERSION="${{ github.event.inputs.release_tag }}"
          VERSION="${VERSION#v}"
          plutil -replace CFBundleShortVersionString -string "$VERSION" dist/HwGDReqs.app/Contents/Info.plist

      - name: Create DMG
        run: |
          hdiutil create -volname "HwGDReqs" \
            -srcfolder dist/HwGDReqs.app \
            -ov -format UDZO \
            HwGDReqs-MacOS-intel.dmg
            
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: HwGDReqs-MacOS-Intel
          path: HwGDReqs-MacOS-intel.dmg

      - name: upload asset to release
        shell: pwsh
        run: |
          Write-Host "Uploading to release: ${{ github.event.inputs.release_tag }}"
          gh release upload "${{ github.event.inputs.release_tag }}" HwGDReqs-MacOS-intel.dmg --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------macOS Silicon Build------------------------
  macos-silicon-build:
    runs-on: macos-14
    continue-on-error: true
    if: github.event.inputs.release_tag != ''
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Inject Kick Client Secret
        run: |
          if [ -n "$KICK_CLIENT_SECRET" ]; then
            echo "" >> hwgdreqs/config.py
            echo "KICK_CLIENT_SECRET = KICK_CLIENT_SECRET or '$KICK_CLIENT_SECRET'" >> hwgdreqs/config.py
          fi
        env:
          KICK_CLIENT_SECRET: ${{ secrets.KICK_CLIENT_SECRET }}

      - name: Build macOS app
        run: |
          pyinstaller --windowed --name HwGDReqs --icon assets/icon.icns --add-data "assets:assets" --osx-bundle-identifier=com.malikhw.hwgdreqs hwgdreqs/main.py

      - name: Update version in Info.plist
        run: |
          VERSION="${{ github.event.inputs.release_tag }}"
          VERSION="${VERSION#v}"
          plutil -replace CFBundleShortVersionString -string "$VERSION" dist/HwGDReqs.app/Contents/Info.plist

      - name: Create DMG
        run: |
          hdiutil create -volname "HwGDReqs" \
            -srcfolder dist/HwGDReqs.app \
            -ov -format UDZO \
            HwGDReqs-MacOS-silicon.dmg
            
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: HwGDReqs-MacOS-Silicon
          path: HwGDReqs-MacOS-silicon.dmg

      - name: upload asset to release
        shell: pwsh
        run: |
          Write-Host "Uploading to release: ${{ github.event.inputs.release_tag }}"
          gh release upload "${{ github.event.inputs.release_tag }}" HwGDReqs-MacOS-silicon.dmg --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------Arch Linux Build------------------------
  arch-linux-build:
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event.inputs.release_tag != ''
    
    container:
      image: archlinux:latest
    
    steps:
      - name: Install build deps
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel sudo git github-cli
      
      - name: make build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
      
      - name: checkout repository
        uses: actions/checkout@v4
      
      - name: Configure git safe directory
        run: |
          git config --global --add safe.directory /__w/HwGDReqs/HwGDReqs
          sudo -u builder git config --global --add safe.directory /__w/HwGDReqs/HwGDReqs

      - name: build package
        run: |
          chown -R builder:builder .
          sudo -u builder makepkg -si --noconfirm
      
      - name: Rename package
        run: |
          find . -name "*.pkg.tar.zst" ! -name "*-debug-*" -exec mv {} hwgdreqs-arch.pkg.tar.zst \;
      
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: "hwgdreqs-arch.pkg.tar.zst"
          retention-days: 30

      - name: upload asset to release
        shell: bash
        run: |
          echo "Uploading to release: ${{ github.event.inputs.release_tag }}"
          gh release upload "${{ github.event.inputs.release_tag }}" hwgdreqs-arch.pkg.tar.zst --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}