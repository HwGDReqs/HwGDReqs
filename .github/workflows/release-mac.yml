name: Build macOS App (vibecoded workflow, i understand NO SHIT about mac)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version'
        required: true
        type: string

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build macOS app
        run: |
          pyinstaller HwGDReqs-mac.spec

      - name: Update version in Info.plist
        run: |
          VERSION="${{ github.event.inputs.release_tag }}"
          VERSION="${VERSION#v}"
          plutil -replace CFBundleShortVersionString -string "$VERSION" dist/HwGDReqs.app/Contents/Info.plist

      - name: Create DMG (optional)
        run: |
          hdiutil create -volname "HwGDReqs" \
            -srcfolder dist/HwGDReqs.app \
            -ov -format UDZO \
            HwGDReqs-${{ github.event.inputs.release_tag }}.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HwGDReqs-macOS
          path: dist/HwGDReqs.app